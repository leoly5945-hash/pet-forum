# Pet Forum — Nginx security config (production)
# Mount: ./deploy/nginx/petforum.conf → /etc/nginx/conf.d/petforum.conf
# SSL certs: /etc/nginx/ssl/live/petforum.vn/ (Certbot)

limit_req_zone  $binary_remote_addr zone=pf_login:10m  rate=5r/m;
limit_req_zone  $binary_remote_addr zone=pf_global:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=pf_api:10m   rate=20r/m;
limit_conn_zone $binary_remote_addr zone=pf_conn:10m;

upstream pf_wordpress {
    server wordpress:80;
}

server {
    listen 80;
    server_name petforum.vn www.petforum.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://petforum.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.petforum.vn;

    ssl_certificate     /etc/nginx/ssl/live/petforum.vn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/petforum.vn/privkey.pem;

    return 301 https://petforum.vn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name petforum.vn;

    ssl_certificate         /etc/nginx/ssl/live/petforum.vn/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/petforum.vn/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/petforum.vn/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-XSS-Protection           "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self';" always;

    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    limit_conn pf_conn 20;
    limit_req  zone=pf_global burst=50 nodelay;

    client_max_body_size 12M;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;

    # ── Block sensitive paths ─────────────────────────────────────
    location ~* /\.env$                              { deny all; return 404; }
    location ~* /docker-compose.*\.yml$            { deny all; return 404; }
    location ~* /wp-config(-extra)?\.php$           { deny all; return 404; }
    location ~* /readme\.(html|txt)$               { deny all; return 404; }
    location ~* /license\.txt$                     { deny all; return 404; }
    location ~* /\.git/                            { deny all; return 404; }
    location ~ /\.                                  { deny all; return 404; access_log off; }

    location = /xmlrpc.php   { deny all; return 404; access_log off; }
    location = /wp-cron.php  { deny all; return 404; access_log off; }
    location = /wp-register.php { return 404; }

    location ~* ^/wp-includes/.*\.php$ { deny all; return 404; }

    location ~* ^/wp-content/uploads/.*\.(php|phtml|pl|py|sh|cgi)$ {
        deny all;
        return 404;
    }

    location ~* ^/wp-content/plugins/.+\.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        proxy_pass http://pf_wordpress;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/wp-content/plugins/.*\.php$ {
        deny all;
        return 404;
    }

    location ~* \.(bak|conf|sql|log|tar|gz|zip)$ {
        deny all;
        return 404;
        access_log off;
    }

    # ── Custom login URL ──────────────────────────────────────────
    location = /dang-nhap-pet {
        limit_req zone=pf_login burst=3 nodelay;
        proxy_pass         http://pf_wordpress;
        include            /etc/nginx/proxy_params;
    }

    location = /dang-nhap-pet/ {
        limit_req zone=pf_login burst=3 nodelay;
        proxy_pass         http://pf_wordpress;
        include            /etc/nginx/proxy_params;
    }

    location = /wp-login.php {
        return 404;
    }

    location = /wp-admin/admin-ajax.php {
        limit_req zone=pf_api burst=10 nodelay;
        proxy_pass         http://pf_wordpress;
        include            /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location /wp-admin/ {
        proxy_pass         http://pf_wordpress;
        include            /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    if ($http_user_agent ~* (masscan|nikto|sqlmap|nmap|nuclei|dirbuster|gobuster|acunetix)) {
        return 444;
    }

    if ($http_user_agent = "") {
        return 444;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf)$ {
        proxy_pass http://pf_wordpress;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://pf_wordpress;
        include            /etc/nginx/proxy_params;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/petforum_access.log combined;
    error_log  /var/log/nginx/petforum_error.log warn;
}
